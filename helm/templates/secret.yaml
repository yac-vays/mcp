{{- if .Values.env }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fullname" . }}-env
  labels:
    app: {{ include "name" . }}
    chart: {{ include "chart" . }}
  {{- with .Values.secretAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
